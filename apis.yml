aid: silent-eight
name: Silent Eight
description: 'Silent Eight is an AI-driven financial crime compliance (FCC) technology company founded
  in Singapore in 2015 and operating globally. Its flagship platform, Iris 7, delivers policy-bound agentic
  AI that replicates the investigative judgement of experienced compliance analysts, executing explainable,
  auditable decisions across sanctions screening, anti-money laundering, transaction monitoring, fraud,
  trade surveillance and complex customer due diligence. Iris 7 is composed of AI Agents by capability
  (Customer Screening, Payment Screening, Transaction Monitoring, Risk Data Manager, Adverse Media, Case
  Manager) plus pre-built and custom agents, and is deployed as a governed decision layer on top of existing
  screening and monitoring systems via managed service, customer cloud, hybrid or on-premise infrastructure.
  In production with Tier 1 institutions since 2018, including HSBC, Standard Chartered, Emirates NBD
  and First Abu Dhabi Bank. Silent Eight publishes no public developer program: the platform is delivered
  under enterprise contract and integrated into each institution''s tenant, so no machine-readable API
  contract is published to the open web.'
